name: Setup
description: Install Nix and connect the Cachix caches. Runs after actions/checkout.

inputs:
  cachix-token:
    description: Cachix auth token. Empty degrades to read-only, which is what fork PRs get.
    default: ""
  gc:
    description: Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
    default: "false"

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          # Trust the substituter/key the flake declares via nixConfig.
          accept-flake-config = true
          ${{ inputs.gc == 'true' && 'min-free = 3221225472' || '' }}
          ${{ inputs.gc == 'true' && 'max-free = 10737418240' || '' }}

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: unstoppablemango
        extraPullNames: mangopkgs,unmango
        authToken: ${{ inputs.cachix-token }}
