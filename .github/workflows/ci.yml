name: CI

# Building and publishing live in this file rather than a workflow of their own
# because `needs` cannot span workflows, and the branch ruleset requires exactly
# one status check: the `build` summary at the bottom.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ghcr.io/unmango
  # The Docker Hub namespace predates the unmango org and is where the existing
  # images already live.
  HUB_NAMESPACE: docker.io/unstoppablemango

jobs:
  check:
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runs-on: ubuntu-latest
            linux: true
          - name: aarch64-linux
            runs-on: ubuntu-24.04-arm
            linux: true
          # Linux images cannot be built on darwin; this leg only checks that
          # the flake still evaluates and formats there.
          - name: aarch64-darwin
            runs-on: macos-latest
            linux: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true

      # An empty authToken degrades to read-only, which is what fork PRs get.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: make check

      # The images themselves are covered by the `image` matrix. Archives are
      # not published, so they are built here instead.
      - if: matrix.linux
        run: nix build .#archives

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - run: nix develop -c make manifests

      - name: Pinned base manifests are stale, run `make manifests`
        run: git diff --exit-code

  enumerate:
    name: enumerate
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
      meta: ${{ steps.list.outputs.meta }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      # Reads the same attrset the packages are built from, so adding an image
      # needs no edit to this workflow.
      - id: list
        run: |
          meta="$(nix eval --json '.#legacyPackages.x86_64-linux.imageMeta')"
          {
            echo "images=$(jq -c 'keys' <<<"$meta")"
            echo "meta=$(jq -c . <<<"$meta")"
          } >>"$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [enumerate]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.enumerate.outputs.images) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build ".#${{ matrix.image }}"

      # skopeo's `nix:` transport reads layer blobs out of the local store, so
      # the push has to happen in the same job that built the image. The
      # per-arch tags are intermediate; `index` assembles the real ones.
      - name: Push per-arch image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          GHCR_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          nix run ".#${IMAGE}.copyTo" -- \
            --dest-creds "$GHCR_CREDS" \
            "docker://${GHCR_NAMESPACE}/${IMAGE}:${GITHUB_SHA}-${ARCH}"

          nix run ".#${IMAGE}.copyTo" -- \
            --dest-creds "$HUB_CREDS" \
            "docker://${HUB_NAMESPACE}/${IMAGE}:${GITHUB_SHA}-${ARCH}"

  index:
    name: index (${{ matrix.image }})
    needs: [enumerate, image]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.enumerate.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # skopeo has no index-create verb, so buildx assembles the manifest list
      # from the per-arch tags already pushed to each registry.
      - name: Assemble multi-arch index
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ fromJSON(needs.enumerate.outputs.meta)[matrix.image].version }}
        run: |
          short="${GITHUB_SHA::7}"

          for ns in "$GHCR_NAMESPACE" "$HUB_NAMESPACE"; do
            repo="${ns}/${IMAGE}"
            docker buildx imagetools create \
              --tag "${repo}:${VERSION}" \
              --tag "${repo}:sha-${short}" \
              --tag "${repo}:latest" \
              "${repo}:${GITHUB_SHA}-amd64" \
              "${repo}:${GITHUB_SHA}-arm64"
          done

  build:
    name: build
    # The one required status check. Matrix jobs report a context per leg, which
    # a ruleset cannot require without naming every image and system, so this
    # collapses them into a single stable name.
    #
    # `index` is deliberately absent: it only runs on main, and publishing is
    # not a merge gate.
    needs: [check, manifests, enumerate, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          printf 'check      %s\n' '${{ needs.check.result }}'
          printf 'manifests  %s\n' '${{ needs.manifests.result }}'
          printf 'enumerate  %s\n' '${{ needs.enumerate.result }}'
          printf 'image      %s\n' '${{ needs.image.result }}'

      # Anything other than success fails the gate, `skipped` included: a job is
      # skipped here only when something it needed failed first.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
