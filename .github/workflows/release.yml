name: Release

# Runs after the Images workflow has finished for a commit on the default
# branch, rather than on the push itself, so a release is only ever cut for a
# commit whose images are already published. A failed Images run reaches none of
# the jobs below. release-please opens or updates the release PR whenever there
# are releasable commits since the last release; when the run follows a merged
# release PR it tags the release, and the jobs below retag that commit's
# `sha-<short>` images with the release version. Nothing is rebuilt.
#
# release-please releases whatever is at the head of `main`, which is not
# necessarily the commit whose Images run triggered this workflow. When a later
# push has already landed, the release is cut for that newer commit while its
# own Images run is still in flight, and `tag` fails on the missing `sha-` tag.
# Recover by re-running this run's failed jobs once that Images run has
# finished: `release-please` succeeded, so the released version and sha carry
# over and nothing is released twice.
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  GHCR_NAMESPACE: ghcr.io/unmango
  HUB_NAMESPACE: docker.io/unstoppablemango

jobs:
  release-please:
    name: release-please
    # Images also runs for pull requests; only a push to the default branch
    # can produce a release.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A pull request opened with GITHUB_TOKEN triggers no workflows, so the
      # release PR would arrive without the `build` and `image` checks the
      # ruleset requires. RELEASE_PLEASE_TOKEN is a PAT with contents and
      # pull-requests write.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  enumerate:
    name: enumerate
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      # The released commit, not the workflow_run head: a later push to main
      # may already have landed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Same enumeration as the Images workflow, so the two agree on which
      # images exist and how they are named.
      - id: list
        run: |
          nix eval --json '.#legacyPackages.x86_64-linux.imageMeta' \
            | jq -c 'to_entries | map({ key } + .value) | "images=\(.)"' -r >>"$GITHUB_OUTPUT"

  tag:
    name: tag (${{ matrix.image.key }})
    needs: [release-please, enumerate]
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.enumerate.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `<upstream>-<release>[-<variant>]`, built from `version` rather than
      # `imageTag` so the variant stays last, matching `sha-<short>-<variant>`.
      # The source is the `sha-` tag Images pushed for the released commit,
      # resolved to a digest so both registries receive the same index and a
      # re-run cannot pick up different content. A release tag that already
      # points elsewhere is an error rather than something to overwrite; one
      # that already points at this digest means the step already ran.
      - name: Retag released images
        env:
          IMAGE_NAME: ${{ matrix.image.imageName }}
          UPSTREAM: ${{ matrix.image.version }}
          VARIANT: ${{ matrix.image.variant }}
          RELEASE: ${{ needs.release-please.outputs.version }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          short="${SHA::7}"
          suffix="${VARIANT:+-${VARIANT}}"

          # Empty rather than non-zero for a tag that is not there: the steps
          # run under `bash -e`, and a missing release tag is the normal case.
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null || true
          }

          for ns in "$GHCR_NAMESPACE" "$HUB_NAMESPACE"; do
            repo="${ns}/${IMAGE_NAME}"
            release="${repo}:${UPSTREAM}-${RELEASE}${suffix}"

            src="$(digest "${repo}:sha-${short}${suffix}")"
            if [ -z "$src" ]; then
              echo "::error::${repo}:sha-${short}${suffix} is not published" >&2
              exit 1
            fi

            existing="$(digest "$release")"
            if [ "$existing" = "$src" ]; then
              echo "${release} already points at ${src}"
              continue
            fi
            if [ -n "$existing" ]; then
              echo "::error::${release} points at ${existing}, refusing to replace it with ${src}" >&2
              exit 1
            fi

            docker buildx imagetools create --tag "$release" "${repo}@${src}"
          done

  release:
    name: release
    # One place to see whether the whole release landed. Not a required check:
    # nothing here gates a merge.
    needs: [release-please, enumerate, tag]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          printf 'release-please  %s\n' '${{ needs.release-please.result }}'
          printf 'enumerate       %s\n' '${{ needs.enumerate.result }}'
          printf 'tag             %s\n' '${{ needs.tag.result }}'

      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
